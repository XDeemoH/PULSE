<body>
  <header class="masthead">
    <a class="brand" href="#" aria-label="等高线工坊首页"><span class="brand-mark" aria-hidden="true">◎</span> PULSE <span>/ FIELD STUDIES</span></a>
    <span class="edition">NO. 001 <span>—</span> TOPOGRAPHIC ART</span>
    <a class="edition full-version" href="https://github.com/XDeemoH/contour-workshop" target="_blank" rel="noopener noreferrer" title="照片转等高线、轮廓发光、PNG / SVG 导出">完整版 · Contour Workshop ↗</a>
  </header>
  <main class="workspace">
    <aside class="controls" aria-label="背景参数">
      <div class="intro"><p class="eyebrow">CONTOUR STUDIO</p><h1>等高线工坊</h1><p class="intro-copy">让地形缓慢生长，<br>把一刻的起伏留成画面。</p></div>
      <section class="control-section">
        <h2><span>01</span> 画面</h2>
        <div class="segmented" aria-label="画面用途">
          <button type="button" id="preset-art" aria-pressed="true">艺术线稿</button>
          <button type="button" id="preset-quiet" aria-pressed="false">安静背景</button>
        </div>
        <div class="palette-row"><span>底色</span><div class="theme-switch" aria-label="底色">
          <button type="button" id="theme-dark" class="swatch dark" aria-label="墨黑底色" aria-pressed="true"></button>
          <button type="button" id="theme-light" class="swatch light" aria-label="纸白底色" aria-pressed="false"></button>
        </div><span id="theme-name" class="quiet">墨黑</span></div>
        <div class="seed-row"><label for="seed">地形种子</label><input id="seed" type="number" min="0" max="999999" value="721"><button id="shuffle" type="button" title="更换种子，生成新的地形">换一幅 <span aria-hidden="true">↗</span></button></div>
      </section>
      <section class="control-section">
        <h2><span>02</span> 地形</h2>
        <label class="slider-label" for="scale">地形尺度 <output id="scale-out">3.7</output></label><input id="scale" type="range" min="1" max="7" step="0.1" value="3.7">
        <label class="slider-label" for="bands">等高线密度 <output id="bands-out">48</output></label><input id="bands" type="range" min="10" max="80" step="1" value="48">
        <label class="slider-label" for="warp">弯曲程度 <output id="warp-out">1.35</output></label><input id="warp" type="range" min="0" max="3" step="0.05" value="1.35">
        <label class="slider-label" for="octaves">地形细节 <output id="octaves-out">3</output></label><input id="octaves" type="range" min="1" max="5" step="1" value="3">
      </section>
      <section class="control-section">
        <h2><span>03</span> 线条</h2>
        <label class="slider-label" for="line-width">线宽 <output id="line-width-out">0.85 px</output></label><input id="line-width" type="range" min="0.35" max="2" step="0.05" value="0.85">
        <label class="slider-label" for="alpha">线条显隐 <output id="alpha-out">64%</output></label><input id="alpha" type="range" min="0.02" max="1" step="0.01" value="0.64">
        <label class="slider-label" for="edge">边缘渐隐 <output id="edge-out">10%</output></label><input id="edge" type="range" min="0.02" max="0.3" step="0.01" value="0.1">
        <div class="inline-settings"><label class="color-label" for="line-color"><input id="line-color" type="color" value="#b8bdbb"> 线色</label><label class="check-label"><input id="dashed" type="checkbox" checked> 穿插虚线</label></div>
        <details class="advanced"><summary>精细线条与渐隐</summary>
          <label class="slider-label" for="softness">线条柔度 <output id="softness-out">0.8</output></label><input id="softness" type="range" min="0.1" max="2" step="0.05" value="0.8">
          <label class="slider-label" for="fade-inner">中心保留范围 <output id="fade-inner-out">0.48</output></label><input id="fade-inner" type="range" min="0.05" max="0.7" step="0.01" value="0.48">
          <label class="slider-label" for="fade-outer">外圈淡出范围 <output id="fade-outer-out">0.82</output></label><input id="fade-outer" type="range" min="0.3" max="1.2" step="0.01" value="0.82">
        </details>
      </section>
      <section class="control-section">
        <h2><span>04</span> 动态</h2>
        <label class="slider-label" for="speed">形变速度 <output id="speed-out">0.018</output></label><input id="speed" type="range" min="0" max="0.08" step="0.001" value="0.018">
        <label class="slider-label" for="accent">琥珀掠光 <output id="accent-out">0%</output></label><input id="accent" type="range" min="0" max="1" step="0.01" value="0">
      </section>
      <div class="utility"><button type="button" id="reset">恢复初始</button></div>
    </aside>
    <section class="art-workspace" aria-label="背景预览与导出">
      <div class="stage-header"><div><span class="status-dot" aria-hidden="true"></span><span id="motion-status">连续变形</span></div><span id="seed-caption">SEED 000721</span></div>
      <div class="art-mount" id="art-mount"><div class="art-frame" id="art-frame"><canvas id="art" role="img" aria-label="可调动态等高线艺术背景"></canvas></div></div>
      <div class="playback">
        <button type="button" id="play" aria-label="暂停动态"><span id="play-icon" aria-hidden="true">Ⅱ</span></button>
        <label for="timeline" class="sr-only">时间位置（秒）</label><input type="range" id="timeline" min="0" max="180" step="0.1" value="0">
        <output id="time-label">00:00.0</output>
      </div>
      <div class="export-bar">
        <div class="export-info"><span>静态导出</span><span class="quiet">1536 × 2048 <b>·</b> 3:4</span></div>
        <div class="export-actions"><label class="check-label"><input id="transparent" type="checkbox"> 透明底</label><button id="export-svg" type="button" class="secondary" title="CPU 矢量近似，便于编辑轮廓；与动态画面略有差异">SVG</button><button id="export-png" type="button" class="primary">导出 PNG <span aria-hidden="true">↓</span></button></div>
      </div>
      <div class="bottom-line"><p id="message" role="status" aria-live="polite">同一个种子，留住同一片地形。</p><div><button type="button" id="save-settings">保存参数</button><button type="button" id="load-settings">读取参数</button><input type="file" id="settings-file" accept=".json,application/json" hidden></div></div>
    </section>
  </main>
  <footer class="page-footer"><span>PROCEDURAL TERRAIN / ORIGINAL FIELD</span><span>线条连续变形 <i>·</i> 所有文件在本机处理</span></footer>

  $('time-label').value = formatTime(state.time);
  if (!timerDragging) $('timeline').value = Math.min(180, state.time);
}
const playbackTimer = setInterval(refreshPlayback, 200);
function download(blob, name) {
  const url = URL.createObjectURL(blob), a = document.createElement('a'); a.href = url; a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function filename(extension) { return 'contour-' + theme + '-seed' + field.getOptions().field.seed + '-t' + field.getState().time.toFixed(1).replace('.', '_') + '.' + extension; }
$('export-png').addEventListener('click', async () => {
  const button = $('export-png'); button.disabled = true; message('正在导出 1536 × 2048 画面…');
  try { const at = field.getState().time; const blob = await field.exportPNG({ time: at, transparent: $('transparent').checked }); download(blob, filename('png')); message('PNG 已导出，尺寸 1536 × 2048。'); }
  catch (error) { message('导出未完成：' + error.message); } finally { button.disabled = false; }
});
$('export-svg').addEventListener('click', () => {
  const svg = field.exportSVG({ transparent: $('transparent').checked });
  download(new Blob([svg], { type: 'image/svg+xml' }), filename('svg')); message('SVG 已导出：可编辑的矢量近似，轮廓与动态画面略有差异。');
});
$('save-settings').addEventListener('click', () => {
  const data = { version: 1, theme, preset, time: field.getState().time, options: field.getOptions() };
  download(new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }), filename('json')); message('参数已保存，读取后可回到这一刻。');
});
$('load-settings').addEventListener('click', () => $('settings-file').click());
$('settings-file').addEventListener('change', async event => {
  const file = event.target.files[0]; if (!file) return;
  try {
    if (file.size > 65536) throw new Error('参数文件应小于 64 KB');
    const data = JSON.parse(await file.text());
    if (data.version !== 1 || !data.options || typeof data.options !== 'object') throw new Error('这不是工坊导出的参数文件');
    theme = data.theme === 'light' ? 'light' : 'dark'; preset = data.preset === 'quiet' ? 'quiet' : 'art';
    field.setOptions(normalizeOptions(data.options)); field.renderAt(Number(data.time) || 0); syncControls(); refreshPlayback(); message('已还原参数与时间位置，点击播放可继续变形。');
  } catch (error) { message('无法读取：' + error.message); } finally { event.target.value = ''; }
});
window.addEventListener('pagehide', () => { field.stop(); clearInterval(playbackTimer); });
window.addEventListener('pageshow', event => { if (event.persisted) location.reload(); });
window.contourStudio = { field, setTheme, applyPreset };
syncControls(); refreshPlayback(); document.documentElement.dataset.ready = 'true';

</script>
</body>
